# Full cluster: a 3-server Raft metadata group + 5 storage nodes over 3 racks +
# gateway (9 containers). Data lives in named volumes; `docker compose down -v`
# wipes it (a volume from before the metadata group cannot be read: wipe it).
# The small profile runs 1 metadata server + 3 nodes + gateway; the group is
# then just meta-1:
#   META_PEERS=meta-1=meta-1:7000 docker compose --profile small up
# (`go run ./tools/task up --small` sets it.)
# COMPOSE_PROFILES=full in the repo-root .env makes the full set the default.
name: chunkd

x-health: &health
  test: ["CMD", "chunkd", "probe", "http://localhost:9000/healthz"]
  interval: 2s
  timeout: 2s
  retries: 15
  start_period: 2s

x-peers: &peers "${META_PEERS:-meta-1=meta-1:7000,meta-2=meta-2:7000,meta-3=meta-3:7000}"

x-meta: &meta
  build: { context: .., dockerfile: deploy/Dockerfile, target: meta }
  image: chunkd-meta:dev
  healthcheck: *health

x-node: &node
  build: { context: .., dockerfile: deploy/Dockerfile, target: node }
  image: chunkd-node:dev
  healthcheck: *health
  depends_on:
    meta-1: { condition: service_healthy }

services:
  meta-1:
    <<: *meta
    profiles: [full, small]
    environment: { CHUNKD_ID: meta-1, CHUNKD_ADVERTISE: "meta-1:7000", CHUNKD_PEERS: *peers }
    volumes: [meta-1:/data]
  meta-2:
    <<: *meta
    profiles: [full]
    environment: { CHUNKD_ID: meta-2, CHUNKD_ADVERTISE: "meta-2:7000", CHUNKD_PEERS: *peers }
    volumes: [meta-2:/data]
  meta-3:
    <<: *meta
    profiles: [full]
    environment: { CHUNKD_ID: meta-3, CHUNKD_ADVERTISE: "meta-3:7000", CHUNKD_PEERS: *peers }
    volumes: [meta-3:/data]

  node-1:
    <<: *node
    profiles: [full, small]
    environment: { CHUNKD_ID: node-1, CHUNKD_ADVERTISE: "node-1:7000", CHUNKD_METAS: *peers, CHUNKD_RACK: r1, CHUNKD_SCRUB_PASS: 30s }
    volumes: [node-1:/data]
  node-2:
    <<: *node
    profiles: [full, small]
    environment: { CHUNKD_ID: node-2, CHUNKD_ADVERTISE: "node-2:7000", CHUNKD_METAS: *peers, CHUNKD_RACK: r2, CHUNKD_SCRUB_PASS: 30s }
    volumes: [node-2:/data]
  node-3:
    <<: *node
    profiles: [full, small]
    environment: { CHUNKD_ID: node-3, CHUNKD_ADVERTISE: "node-3:7000", CHUNKD_METAS: *peers, CHUNKD_RACK: r3, CHUNKD_SCRUB_PASS: 30s }
    volumes: [node-3:/data]
  node-4:
    <<: *node
    profiles: [full]
    environment: { CHUNKD_ID: node-4, CHUNKD_ADVERTISE: "node-4:7000", CHUNKD_METAS: *peers, CHUNKD_RACK: r1, CHUNKD_SCRUB_PASS: 30s }
    volumes: [node-4:/data]
  node-5:
    <<: *node
    profiles: [full]
    environment: { CHUNKD_ID: node-5, CHUNKD_ADVERTISE: "node-5:7000", CHUNKD_METAS: *peers, CHUNKD_RACK: r2, CHUNKD_SCRUB_PASS: 30s }
    volumes: [node-5:/data]

  gateway:
    build: { context: .., dockerfile: deploy/Dockerfile, target: gateway }
    image: chunkd-gateway:dev
    profiles: [full, small]
    environment: { CHUNKD_METAS: *peers }
    ports: ["8080:8080"]
    healthcheck:
      <<: *health
      test: ["CMD", "chunkd", "probe", "http://localhost:8080/healthz"]
    depends_on:
      meta-1: { condition: service_healthy }

  # docker compose run --rm demo: breaks the cluster and narrates the repair.
  # It kills and starts node containers through the Docker API, so it mounts
  # the Docker socket and runs as root: that is root-equivalent access to
  # Docker on this machine. Opt-in and local only.
  demo:
    build: { context: .., dockerfile: deploy/Dockerfile, target: demo }
    image: chunkd-demo:dev
    profiles: [demo]
    user: "0:0"
    environment: { CHUNKD_GATEWAY: "http://gateway:8080", COMPOSE_PROJECT_NAME: chunkd }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    depends_on:
      gateway: { condition: service_healthy }
      node-1: { condition: service_healthy }
      node-2: { condition: service_healthy }
      node-3: { condition: service_healthy }
      node-4: { condition: service_healthy }
      node-5: { condition: service_healthy }

volumes:
  meta-1:
  meta-2:
  meta-3:
  node-1:
  node-2:
  node-3:
  node-4:
  node-5:
