syntax = "proto3";

package chunkd.rpc.v1;

import "chunkd/v1/transport.proto";

option go_package = "github.com/insanityatpeak/chunkd/proto/gen/chunkd/rpc/v1;rpcv1";

// TransportService is the real-mode carrier for core messages. Delivery is
// best effort: the RPC returning OK means the peer queued the message, not
// that it was processed.
service TransportService {
  rpc Deliver(chunkd.v1.DeliverRequest) returns (chunkd.v1.DeliverResponse);
  // Call is request/response for control messages up to 1 MiB.
  rpc Call(chunkd.v1.CallRequest) returns (chunkd.v1.CallResponse);
  // CallStream is request/response for chunk transfers, framed in 1 MiB
  // pieces so no single gRPC message exceeds the 4 MiB default limit.
  rpc CallStream(stream chunkd.v1.CallStreamRequest) returns (stream chunkd.v1.CallStreamResponse);
}
