syntax = "proto3";

package chunkd.v1;

option go_package = "github.com/insanityatpeak/chunkd/proto/gen/chunkd/v1;chunkdv1";

// Message types only. Services live in chunkd.rpc.v1 so that core and the
// WASM build link these types without pulling in gRPC and net/http.

message PingRequest {
  // Node ID of the sender.
  string from = 1;
  // Sender-local sequence number; lets the receiver spot duplicates and gaps.
  uint64 seq = 2;
}

message PingResponse {
  // Node ID of the responder.
  string from = 1;
  // Echo of PingRequest.seq.
  uint64 seq = 2;
}
