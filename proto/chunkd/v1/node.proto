syntax = "proto3";

package chunkd.v1;

option go_package = "github.com/insanityatpeak/chunkd/proto/gen/chunkd/v1;chunkdv1";

// Heartbeat is sent by every storage node to the metadata server each second.
message Heartbeat {
  string node = 1;
  string rack = 2;
  // gRPC address clients use for chunk transfers; empty in sim.
  string addr = 3;
  int64 used_bytes = 4;
  int64 chunk_count = 5;
  bool draining = 6;
  uint64 seq = 7;
  // Random per process start; seq restarts at 1 with each incarnation.
  uint64 incarnation = 8;
}

message HeartbeatAck {
  uint64 seq = 1;
  // Set when the metadata server has no location data for this node, e.g.
  // after it restarted; the node answers with a full block report.
  bool need_full_report = 2;
}

// BlockReport lists chunks a node holds. A full report replaces everything
// the metadata server knew about the node; an incremental one adds to it.
message BlockReport {
  string node = 1;
  bool full = 2;
  repeated bytes chunk_ids = 3;
}

message PutChunkRequest {
  bytes id = 1;
  bytes data = 2;
}

message PutChunkResponse {}

message GetChunkRequest {
  bytes id = 1;
}

message GetChunkResponse {
  bytes data = 1;
}

// ReplicateChunk tells a node to pull a chunk from source and store it
// (repair). Completion is the node's incremental block report.
message ReplicateChunk {
  uint64 copy_id = 1;
  bytes chunk_id = 2;
  string source = 3;
  string source_addr = 4;
}

// ReplicateFailed tells the metadata server a copy will not complete, so
// its throttle slots free up before the copy timeout.
message ReplicateFailed {
  uint64 copy_id = 1;
  bytes chunk_id = 2;
  string node = 3;
  string error = 4;
}
