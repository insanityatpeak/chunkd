syntax = "proto3";

package chunkd.v1;

option go_package = "github.com/insanityatpeak/chunkd/proto/gen/chunkd/v1;chunkdv1";

// Heartbeat is sent by every storage node to the metadata server each second.
message Heartbeat {
  string node = 1;
  string rack = 2;
  // gRPC address clients use for chunk transfers; empty in sim.
  string addr = 3;
  int64 used_bytes = 4;
  int64 chunk_count = 5;
  bool draining = 6;
  uint64 seq = 7;
  // Random per process start; seq restarts at 1 with each incarnation.
  uint64 incarnation = 8;
  // Integrity, for the cluster view: chunks quarantined by this process,
  // and the current scrub pass's progress in chunks.
  uint64 corrupt = 9;
  int64 scrub_done = 10;
  int64 scrub_total = 11;
  uint64 scrub_passes = 12;
}

message HeartbeatAck {
  uint64 seq = 1;
  // Set when the metadata server has no location data for this node, e.g.
  // after it restarted; the node answers with a full block report.
  bool need_full_report = 2;
}

// BlockReport lists chunks a node holds. A full report replaces everything
// the metadata server knew about the node; an incremental one adds to it.
message BlockReport {
  string node = 1;
  bool full = 2;
  repeated bytes chunk_ids = 3;
  // Chunks deleted since the last report (incremental reports only).
  repeated bytes deleted_ids = 4;
  // The sending process's incarnation (as in its heartbeats) and a report
  // sequence number, increasing within the incarnation. A full report with
  // seq S lists exactly the store changes whose reports carry seq < S, so
  // the metadata server can order reports the network reordered.
  uint64 incarnation = 5;
  uint64 seq = 6;
  // Chunks that failed verification and were quarantined (incremental
  // reports only); like deleted_ids, they no longer count as replicas.
  repeated bytes corrupt_ids = 7;
  // GC deletes the node refused because the chunk was written after the
  // delete's fence. The copy stays and still counts.
  repeated bytes kept_ids = 8;
}

message PutChunkRequest {
  bytes id = 1;
  bytes data = 2;
}

message PutChunkResponse {}

message GetChunkRequest {
  bytes id = 1;
}

message GetChunkResponse {
  bytes data = 1;
}

// ReplicateChunk tells a node to pull a chunk from source and store it
// (repair). Completion is the node's incremental block report.
message ReplicateChunk {
  uint64 copy_id = 1;
  bytes chunk_id = 2;
  string source = 3;
  string source_addr = 4;
}

// ReplicateFailed tells the metadata server a copy will not complete, so
// its throttle slots free up before the copy timeout.
message ReplicateFailed {
  uint64 copy_id = 1;
  bytes chunk_id = 2;
  string node = 3;
  string error = 4;
}

// DeleteReplica tells a node to drop its copy of an over-replicated chunk
// (a trim) or of an unreferenced one (GC). The node confirms with
// deleted_ids, or kept_ids for a refused GC delete, in a block report.
message DeleteReplica {
  uint64 trim_id = 1;
  bytes chunk_id = 2;
  // GC delete of an unreferenced copy: conditional on the fence. The node
  // refuses if it is a different incarnation, or if it wrote the chunk in
  // a change numbered above fence_seq (after the metadata server's view).
  bool gc = 3;
  uint64 fence_incarnation = 4;
  uint64 fence_seq = 5;
}

// VerifyChunk asks a node to re-read and re-hash one chunk; a mismatch is
// quarantined and reported like a failed read.
message VerifyChunk {
  bytes chunk_id = 1;
}
