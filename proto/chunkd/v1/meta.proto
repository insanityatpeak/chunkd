syntax = "proto3";

package chunkd.v1;

option go_package = "github.com/insanityatpeak/chunkd/proto/gen/chunkd/v1;chunkdv1";

// ---- Log operations. Each is applied deterministically; anything decided
// from live, non-durable state (placement) is recorded in the op.

message Replicas {
  repeated string nodes = 1;
}

// Redundancy is how an upload's chunks survive node loss (ADR-0022).
enum Redundancy {
  // Every chunk stored as RF full copies.
  REDUNDANCY_REPLICATED = 0;
  // Every chunk stored as a Reed-Solomon stripe: 4 data and 2 parity shards
  // on 6 distinct nodes.
  REDUNDANCY_EC_4_2 = 1;
}

message BeginUploadOp {
  string path = 1;
  // Live version the writer expects; 0 means the path must not exist.
  uint64 expected_version = 2;
  int64 size = 3;
  int32 chunk_size = 4;
  repeated Replicas placement = 5;
  // Set by servers that require every chunk to be claimed before commit.
  // Unset in logs written before claims existed, so they replay unchanged.
  bool claims = 6;
  // Commit without comparing versions: the upload replaces whatever is live
  // when it commits. Opt-in; silently loses concurrent updates (ADR-0014).
  bool last_writer_wins = 7;
  // Chosen by the client and kept across retries: a Begin whose request_id
  // matches a pending upload returns that upload instead of opening another,
  // so a retry after a lost response or a leader change opens exactly one.
  // Empty: no deduplication.
  bytes request_id = 8;
  // EC: placement lists 6 nodes per chunk, shard i on nodes[i].
  Redundancy redundancy = 9;
  // The whole file's SHA-256, declared at Begin by a resumable upload
  // (ADR-0024); Commit must then carry the same. Empty: not declared.
  bytes sha256 = 10;
}

message ChunkClaim {
  int32 index = 1;
  // The chunk's content hash, or its stripe's logical ID under EC.
  bytes id = 2;
  // EC only: the 6 shard block IDs, data shards first.
  repeated bytes shards = 3;
}

// ClaimChunksOp records that an upload is about to reference these chunks.
// A claimed chunk is marked for GC from before any copy of it is written.
message ClaimChunksOp {
  uint64 upload_id = 1;
  repeated ChunkClaim claims = 2;
}

message CommitUploadOp {
  uint64 upload_id = 1;
  repeated bytes chunk_ids = 2;
  bytes sha256 = 3;
}

message AbortUploadOp {
  uint64 upload_id = 1;
}

message DeleteOp {
  string path = 1;
  // 0 deletes whatever version is live.
  uint64 expected_version = 2;
}

// UndeleteOp publishes a copy of a retained version as the new latest one.
message UndeleteOp {
  string path = 1;
  uint64 version = 2;
  // Live version the caller expects; 0 means the path must be deleted.
  uint64 expected_version = 3;
}

// AdvanceEpochOp moves logical time forward one GC epoch. Retired versions
// older than retain_epochs are dropped when it applies. The retention is in
// the op, not in config, so every replica of the log drops the same ones.
message AdvanceEpochOp {
  uint32 retain_epochs = 1;
  // Pending uploads not begun or claimed from for lease_epochs epochs are
  // aborted, releasing their claims. 0: uploads never expire.
  uint32 lease_epochs = 2;
}

// GCTarget is one copy a GC sweep may delete. The fence is the leader's view
// of the node's block reports when it decided (ADR-0016): the node refuses
// the delete if it wrote the chunk after it.
message GCTarget {
  bytes chunk_id = 1;
  string node = 2;
  uint64 fence_incarnation = 3;
  uint64 fence_seq = 4;
}

// GCIntentOp authorizes deleting copies. A leader sends a GC delete only
// after the intent has committed, so a deposed leader, which cannot commit,
// can never authorize one. Applying it skips targets whose chunk is marked
// (a claim or a reference exists) at that point in the log, and targets
// already pending.
message GCIntentOp {
  repeated GCTarget targets = 1;
}

// GCDoneOp records that the nodes answered (deleted or kept): only chunk_id
// and node are used. Until it applies, the delete is pending and may be
// re-sent with its original fence by any leader.
message GCDoneOp {
  repeated GCTarget targets = 1;
}

// TrimTarget is one surplus copy to remove: chunk_id on node.
message TrimTarget {
  bytes chunk_id = 1;
  string node = 2;
}

// TrimIntentOp authorizes trimming surplus copies (ADR-0020). As with GC, the
// delete is sent only after the intent commits, so a deposed leader can never
// authorize one. Applying it skips a target whose chunk already has a trim
// pending: at most one copy of a chunk is being trimmed at a time, whichever
// leader decided it.
message TrimIntentOp {
  repeated TrimTarget targets = 1;
}

// TrimDoneOp ends pending trims: the node answered, or the copy is gone.
message TrimDoneOp {
  repeated TrimTarget targets = 1;
}

// NodeAdmin is a storage node's operator-set state (ADR-0021).
enum NodeAdmin {
  // Takes new data and counts toward RF. Any node not in the table.
  NODE_ADMIN_ACTIVE = 0;
  // Takes no new data; its copies serve reads but do not count toward RF,
  // so its chunks are copied off.
  NODE_ADMIN_DRAINING = 1;
  // Retired: no data placed, no copy counted or read. Safe to switch off.
  NODE_ADMIN_DECOMMISSIONED = 2;
}

// NodeAdminOp sets a node's admin state. Validated in log order:
// decommissioned only from draining; a repeat of the current state is a
// no-op, so a retried command applies once.
message NodeAdminOp {
  string node = 1;
  NodeAdmin state = 2;
}

message Op {
  oneof op {
    BeginUploadOp begin = 1;
    CommitUploadOp commit = 2;
    AbortUploadOp abort = 3;
    DeleteOp delete = 4;
    ClaimChunksOp claim = 5;
    UndeleteOp undelete = 6;
    AdvanceEpochOp advance_epoch = 7;
    GCIntentOp gc_intent = 8;
    GCDoneOp gc_done = 9;
    TrimIntentOp trim_intent = 10;
    TrimDoneOp trim_done = 11;
    NodeAdminOp node_admin = 12;
  }
}

// ---- Snapshot of the durable state.

enum VersionState {
  VERSION_STATE_UNSPECIFIED = 0;
  VERSION_STATE_COMMITTED = 1;
  VERSION_STATE_TOMBSTONE = 2;
}

message FileVersion {
  uint64 version = 1;
  int64 size = 2;
  bytes sha256 = 3;
  repeated bytes chunk_ids = 4;
  int32 chunk_size = 5;
  VersionState state = 6;
  // Upload that created this version; makes a retried commit idempotent.
  uint64 upload_id = 7;
  // Superseded by a newer version (or a delete) at epoch retired_at; kept
  // for undelete until retain_epochs later.
  bool retired = 8;
  uint64 retired_at = 9;
  // Set on versions created by undelete: the version they copied.
  uint64 restored_from = 10;
  Redundancy redundancy = 11;
}

message FileRecord {
  string path = 1;
  repeated FileVersion versions = 2;
}

message ChunkRecord {
  bytes id = 1;
  uint64 refcount = 2;
  int64 size = 3;
  // A stripe's 6 shard block IDs; empty for a replicated chunk.
  repeated bytes shards = 4;
}

message UploadRecord {
  uint64 id = 1;
  BeginUploadOp begin = 2;
  repeated ChunkClaim claims = 3;
  // Epoch of the upload's begin or latest claim: its lease.
  uint64 touched_epoch = 4;
}

message MetaSnapshot {
  repeated FileRecord files = 1;
  repeated ChunkRecord chunks = 2;
  repeated UploadRecord uploads = 3;
  uint64 last_upload_id = 4;
  uint64 epoch = 5;
  // GC deletes authorized and not yet answered.
  repeated GCTarget gc_pending = 6;
  // Trims authorized and not yet answered, at most one per chunk.
  repeated TrimTarget trim_pending = 7;
  // Nodes not active, sorted by node.
  repeated NodeAdminOp node_admin = 8;
}

// ---- Client RPCs to the metadata server.

message Replica {
  string node = 1;
  // gRPC address in real mode; empty in sim.
  string addr = 2;
  // The detector suspects the node: readable, tried after alive replicas.
  bool suspect = 3;
}

message ChunkPlacement {
  repeated Replica replicas = 1;
}

message BeginUploadRequest {
  string path = 1;
  uint64 expected_version = 2;
  int64 size = 3;
  bool last_writer_wins = 4;
  // See BeginUploadOp.request_id.
  bytes request_id = 5;
  Redundancy redundancy = 6;
  // See BeginUploadOp.sha256.
  bytes sha256 = 7;
}

message BeginUploadResponse {
  uint64 upload_id = 1;
  int32 chunk_size = 2;
  // EC: 6 replicas per chunk, shard i to replicas[i].
  repeated ChunkPlacement placement = 3;
  // Acknowledged replicas (EC: shards) per chunk the commit will require.
  int32 min_replicas = 4;
  Redundancy redundancy = 5;
}

message CommitUploadRequest {
  uint64 upload_id = 1;
  repeated bytes chunk_ids = 2;
  bytes sha256 = 3;
}

message CommitUploadResponse {
  uint64 version = 1;
}

// UploadStatusRequest asks what a pending upload holds (ADR-0024).
message UploadStatusRequest {
  uint64 upload_id = 1;
}

message UploadStatusResponse {
  uint64 upload_id = 1;
  string path = 2;
  // Set when the upload already committed: the version it created. The
  // other fields are then empty.
  uint64 committed_version = 3;
  int64 size = 4;
  bytes sha256 = 5;
  // Placement, chunk size, commit threshold and redundancy, as Begin
  // answered them.
  BeginUploadResponse begin = 6;
  repeated ClaimStatus claims = 7;
  // The lease runs out when the epoch reaches this; epoch is the current one.
  uint64 lease_expires_epoch = 8;
  uint64 epoch = 9;
}

// ClaimStatus is one claimed chunk of a pending upload: present when it is
// stored as a commit requires.
message ClaimStatus {
  int32 index = 1;
  bytes id = 2;
  bool present = 3;
}

message ClaimChunksRequest {
  uint64 upload_id = 1;
  repeated ChunkClaim claims = 2;
}

message ClaimChunksResponse {
  // present[i]: claims[i] already has enough replicas on alive nodes, so
  // the client skips writing it (dedup). A hint: commit re-checks.
  repeated bool present = 1;
  // Where each present chunk is, for the client's manifest.
  repeated ChunkPlacement locations = 2;
}

message AbortUploadRequest {
  uint64 upload_id = 1;
}

message AbortUploadResponse {}

message DeleteRequest {
  string path = 1;
  uint64 expected_version = 2;
}

message DeleteResponse {
  uint64 version = 1;
}

message UndeleteRequest {
  string path = 1;
  // 0 restores the newest retained version that is not a delete marker.
  uint64 version = 2;
  uint64 expected_version = 3;
}

message UndeleteResponse {
  uint64 version = 1;
}

message ChunkLocation {
  // The content hash, or the stripe's logical ID when shards is set.
  bytes id = 1;
  int64 size = 2;
  repeated Replica replicas = 3;
  // EC: the stripe's 6 shards in index order; replicas is empty.
  repeated ShardLocation shards = 4;
}

message ShardLocation {
  bytes id = 1;
  repeated Replica replicas = 2;
}

message StatRequest {
  string path = 1;
  // 0 is the live version.
  uint64 version = 2;
}

message StatResponse {
  string path = 1;
  uint64 version = 2;
  int64 size = 3;
  bytes sha256 = 4;
  int32 chunk_size = 5;
  repeated ChunkLocation chunks = 6;
  // EC: every chunk location lists its shards.
  Redundancy redundancy = 7;
}

message LogRequest {
  string path = 1;
}

message VersionInfo {
  uint64 version = 1;
  int64 size = 2;
  bytes sha256 = 3;
  int32 chunk_count = 4;
  // A delete marker: the path read as not found from this version on.
  bool tombstone = 5;
  // Superseded; undelete can restore it until it expires.
  bool retired = 6;
  // Epoch at which a retired version is dropped.
  uint64 expires_epoch = 7;
  Redundancy redundancy = 8;
}

message LogResponse {
  // Oldest first.
  repeated VersionInfo versions = 1;
  uint64 epoch = 2;
}

message ListRequest {
  string prefix = 1;
}

message FileInfo {
  string path = 1;
  uint64 version = 2;
  int64 size = 3;
  bytes sha256 = 4;
  int32 chunk_count = 5;
  Redundancy redundancy = 6;
}

message ListResponse {
  repeated FileInfo files = 1;
}

message NodeInfo {
  string id = 1;
  string rack = 2;
  string addr = 3;
  int64 used_bytes = 4;
  int64 chunk_count = 5;
  bool alive = 6;
  bool draining = 7;
  // Detector state: alive, suspect or dead (ADR-0010).
  string state = 8;
  int64 heartbeat_age_ms = 9;
  // From the node's heartbeats: copies it quarantined since it started,
  // and its scrub progress.
  uint64 corrupt = 10;
  int64 scrub_done = 11;
  int64 scrub_total = 12;
  uint64 scrub_passes = 13;
  // Operator-set state: "active", "draining" or "decommissioned".
  string admin = 14;
  // The balancer's view (ADR-0020): bytes the leader has located on the node,
  // its target and the band around it. Zero target: no plan (unsettled
  // membership, or not a member).
  int64 balance_used = 15;
  int64 balance_target = 16;
  int64 balance_band = 17;
}

// NodeAdminRequest drains, undrains (to active) or decommissions a node.
message NodeAdminRequest {
  string node = 1;
  NodeAdmin state = 2;
}

message NodeAdminResponse {
  NodeAdmin state = 1;
  // Set when the change is allowed but weakens something, e.g. the last
  // node of a rack is draining.
  string warning = 2;
}

// SuspectRequest: a client received bytes for chunk_id from node that did
// not match the hash. A hint only: the node re-checks, and its check decides.
message SuspectRequest {
  bytes chunk_id = 1;
  string node = 2;
}

message SuspectResponse {}

message ClusterRequest {
  // Return timeline events with seq > events_after.
  uint64 events_after = 1;
}

message ClusterResponse {
  repeated NodeInfo nodes = 1;
  int64 files = 2;
  int64 logical_bytes = 3;
  ClusterHealth health = 4;
  repeated FileHealth file_health = 5;
  repeated RepairCopy copies = 6;
  repeated Event events = 7;
  // Latest event seq; below events_after after a metadata server restart.
  uint64 event_seq = 8;
  // The metadata server's clock, the reference for every *_ms instant.
  int64 now_ms = 9;
  // Bytes committed versions reference, each reference counted, and bytes
  // of the distinct chunks they reference: dedup saves the difference.
  int64 referenced_bytes = 10;
  int64 distinct_bytes = 11;
  // Logical GC epoch; retired versions expire by it.
  uint64 epoch = 12;
  GCStats gc = 13;
  // Deleted paths with a version undelete can still restore.
  repeated DeletedFile deleted = 14;
  // The answering peer's view of the metadata group: the leader it knows
  // (empty during an election) and its Raft term.
  string meta_leader = 15;
  uint64 meta_term = 16;
  // The answering peer: its ID, Raft role (leader, follower, candidate,
  // pre-candidate), commit and applied indexes. Events and *_ms instants
  // are on its clock and in its sequence.
  string meta_peer = 17;
  string meta_role = 18;
  uint64 meta_commit = 19;
  uint64 meta_applied = 20;
  // The group as the answering peer sees it: itself, plus every other voter
  // if it leads. A follower tracks no one else.
  repeated MetaPeer meta_peers = 21;
}

// MetaPeer is one metadata peer as the answering peer sees it.
message MetaPeer {
  string id = 1;
  // Last log index known to be in the peer's log: the leader's match
  // index for a follower, its own last index for the answering peer.
  uint64 match = 2;
  // Milliseconds since the answering peer last heard from it: 0 for
  // itself, -1 if never.
  int64 heard_ago_ms = 3;
}

// GCStats are the sweep's counters since the metadata server started.
message GCStats {
  // Located chunks unmarked at the last sweep.
  uint64 orphans = 1;
  // Deletes sent, re-sends included.
  uint64 sent = 2;
  // Copies nodes confirmed deleted.
  uint64 deleted = 3;
  // Deletes refused because the chunk was written again.
  uint64 kept = 4;
  // Chunks whose refcount or claims disagreed at the last reconciliation.
  uint64 drift = 5;
  uint32 retain_epochs = 6;
  int64 epoch_every_ms = 7;
}

// DeletedFile is a tombstoned path whose newest real version is retained.
message DeletedFile {
  string path = 1;
  // The version undelete restores by default.
  uint64 version = 2;
  int64 size = 3;
  uint64 expires_epoch = 4;
}

// FileHealth is one committed file's replication state.
message FileHealth {
  string path = 1;
  int32 chunks = 2;
  int32 under_replicated = 3;
  // Fewest copies on alive nodes across the file's chunks; for an EC file,
  // fewest available shards of a stripe.
  int32 min_live = 4;
  Redundancy redundancy = 5;
}

// RepairCopy is one re-replication in flight.
message RepairCopy {
  uint64 id = 1;
  bytes chunk_id = 2;
  string source = 3;
  string target = 4;
  int64 bytes = 5;
  int64 started_ms = 6;
  // A shard rebuild: the target reads the shards on these nodes and
  // decodes; source is empty.
  repeated string rebuild_from = 7;
}

// Event is one entry of the metadata server's recent-event ring.
message Event {
  uint64 seq = 1;
  int64 at_ms = 2;
  string kind = 3;
  string node = 4;
  string text = 5;
}

// ClusterHealth is replication state across all wanted chunks.
message ClusterHealth {
  int64 chunks = 1;
  int64 under_replicated = 2;
  int64 over_replicated = 3;
  int64 lost = 4;
  // replicas[i]: chunks with i copies on alive nodes; the last bucket is "or more".
  repeated int64 replicas = 5;
  int64 repair_queued = 6;
  int64 repair_in_flight = 7;
  int64 repair_waiting = 8;
  uint64 repair_completed = 9;
  uint64 repair_bytes = 10;
  uint64 repair_trimmed = 11;
  uint64 repair_timed_out = 12;
  uint64 repair_failed = 13;
  uint64 detector_stalls = 14;
  // Copies removed after failing verification (reads, scrub, re-checks).
  uint64 corrupt_replicas = 15;
  // Of repair_completed: drain copies off leaving nodes, and balance moves.
  uint64 repair_evacuated = 16;
  uint64 repair_moved = 17;
}
