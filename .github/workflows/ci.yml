name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - name: build
        run: go run ./tools/task build
      - name: lint
        run: go run ./tools/task lint
      - name: lint-imports
        run: go run ./tools/task lint-imports
      - name: test (race)
        run: go run ./tools/task test
      - name: chaos, 500 sim seeds (failures print a replay command)
        run: go run ./tools/task chaos --seeds=500
      - name: wasm size budget
        run: go run ./tools/task wasm
      - name: generated code is up to date
        run: |
          go run ./tools/task proto
          git diff --exit-code -- proto/gen

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build cluster.wasm
        run: go run ./tools/task wasm
      - name: build web
        run: go run ./tools/task web
      - name: shared scenario links replay the golden timelines (Playwright)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - name: full cluster up
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: 9 containers running, gateway healthy
        run: |
          docker compose ps
          test "$(docker compose ps -q | wc -l)" -eq 9
          curl -fsS http://localhost:8080/healthz
      - name: e2e put and get 20 MiB through the gateway
        run: go run ./tools/task e2e
      - name: real-mode chaos, short suite (kill, blip, freeze)
        run: go run ./tools/task chaos --mode=real --short
      - name: small profile selects 1 meta + 3 nodes + gateway
        run: |
          docker compose down -v
          docker compose --profile small up -d --wait --wait-timeout 180
          test "$(docker compose --profile small ps -q | wc -l)" -eq 5
          go run ./tools/task e2e
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: down
        if: always()
        run: docker compose down -v --remove-orphans
