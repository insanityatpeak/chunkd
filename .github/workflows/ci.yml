name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - name: build
        run: go run ./tools/task build
      - name: lint
        run: go run ./tools/task lint
      - name: lint-imports
        run: go run ./tools/task lint-imports
      - name: test (race)
        run: go run ./tools/task test
      - name: chaos, 1000 sim seeds, each history checked for linearizability (failures print a replay command)
        run: go run ./tools/task chaos --seeds=1000 --artifacts=chaos-artifacts
      - name: chaos, 500 sim seeds over a 3-peer metadata group (leader kills, freezes, partitions, repeated elections), histories checked
        run: go run ./tools/task chaos --seeds=500 --metas=3 --artifacts=chaos-artifacts/meta
      - name: chaos, 500 sim seeds on 7 nodes with about half the puts erasure-coded, histories checked
        run: go run ./tools/task chaos --seeds=500 --ec --artifacts=chaos-artifacts/ec
      - name: upload non-linearizable histories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-histories
          path: chaos-artifacts
          if-no-files-found: ignore
      - name: wasm size budget
        run: go run ./tools/task wasm
      - name: generated code is up to date
        run: |
          go run ./tools/task proto
          git diff --exit-code -- proto/gen

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build cluster.wasm
        run: go run ./tools/task wasm
      - name: build web
        run: go run ./tools/task web
      - name: shared scenario links replay the golden timelines (Playwright)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - name: full cluster up
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: 9 containers running, gateway healthy
        run: |
          docker compose ps
          test "$(docker compose ps -q | wc -l)" -eq 9
          curl -fsS http://localhost:8080/healthz
      - name: e2e put and get 20 MiB through the gateway
        run: go run ./tools/task e2e
      - name: real-mode chaos, short suite (kill, blip, rot, freeze, kill the metadata leader, drain and decommission, add a node), histories checked
        run: go run ./tools/task chaos --mode=real --short --artifacts=real-chaos-artifacts
      - name: upload non-linearizable real-mode histories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-chaos-histories
          path: real-chaos-artifacts
          if-no-files-found: ignore
      - name: demo container kills a node and verifies the repair (only Docker needed)
        run: docker compose run --rm demo
      - name: dashboard served by the gateway in live mode
        run: |
          curl -fsS http://localhost:8080/mode.json | grep -q live
          curl -fsS http://localhost:8080/ | grep -q '<title>chunkd</title>'
      - name: small profile selects 1 meta + 3 nodes + gateway
        env:
          META_PEERS: meta-1=meta-1:7000
        run: |
          docker compose down -v
          docker compose --profile small up -d --wait --wait-timeout 180
          test "$(docker compose --profile small ps -q | wc -l)" -eq 5
          go run ./tools/task e2e
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: down
        if: always()
        run: docker compose down -v --remove-orphans
